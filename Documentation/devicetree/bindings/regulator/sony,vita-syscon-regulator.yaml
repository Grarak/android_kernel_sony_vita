%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/sony,vita-syscon-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PlayStation Vita Syscon core rails

maintainers:
  - Willi Ye <williye97@gmail.com>

description: |
  The PlayStation Vita's system controller (Syscon, "Ernie") sets the SoC's
  core rails on request, from 0.77 V to 1.38 V in 10 mV steps: VDD (buses,
  DMA), VDDA (ARM cores and L2 cache), VDDC (codec engine) and VDDG (GPU and
  GPU crossbar). The node is a child of the Syscon node; each rail it
  describes is a child node named after the rail.

  No Syscon command reads a rail back. The boot loader sets the rails to
  1.38 V less one of the chip's voltage IDs in 10 mV steps; a rail node names
  that ID's cell as "boot-vid". Without it, the rail's voltage is unknown
  until it is first set.

properties:
  compatible:
    const: sony,vita-syscon-regulator

patternProperties:
  "^vdd[acg]?$":
    $ref: regulator.yaml#
    unevaluatedProperties: false

    properties:
      nvmem-cells:
        maxItems: 1
        description: the voltage ID the boot loader set the rail from

      nvmem-cell-names:
        const: boot-vid

    dependentRequired:
      nvmem-cells: [ nvmem-cell-names ]

required:
  - compatible

additionalProperties: false

examples:
  - |
    syscon-regulator {
        compatible = "sony,vita-syscon-regulator";

        vdda {
            regulator-name = "vdda";
            regulator-min-microvolt = <800000>;
            regulator-max-microvolt = <1200000>;
            regulator-always-on;
            nvmem-cells = <&vid_arm_444>;
            nvmem-cell-names = "boot-vid";
        };
    };
