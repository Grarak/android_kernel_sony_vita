%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/sony,vita-vid.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PlayStation Vita voltage IDs (ScePervasiveVid)

maintainers:
  - Willi Ye <williye97@gmail.com>

description: |
  Read-only 32-bit words holding the chip's own voltage ID for each core rail
  and clock level. They differ from chip to chip; a rail at a level is set to
  1.38 V less the ID in 10 mV steps. The words are described as nvmem cells
  of a fixed layout.

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    const: sony,vita-vid

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    efuse@e3104000 {
        compatible = "sony,vita-vid";
        reg = <0xe3104000 0x100>;
        read-only;

        nvmem-layout {
            compatible = "fixed-layout";
            #address-cells = <1>;
            #size-cells = <1>;

            vid@4 {
                reg = <0x04 0x4>;
            };
        };
    };
