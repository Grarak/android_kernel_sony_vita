%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/sony,vita-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PlayStation Vita I2C controller

maintainers:
  - Willi Ye <williye97@gmail.com>

description: |
  The two I2C controllers of the PlayStation Vita's SoC (SceI2c0Reg at
  0xE0500000, SceI2c1Reg at 0xE0510000). Bus 0 carries the audio codec, the
  clock generator and the back camera's sensor; bus 1 the front camera's
  sensor and the HDMI bridge. Each transfer is a sequence of commands that
  complete with an interrupt, 64 bytes at most per data phase.

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: sony,vita-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  resets:
    maxItems: 1

  sony,speed-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [4, 5]
    default: 5
    description: |
      The value SceLowio writes to the controller's speed register (+0x18):
      5 when the Hardware Info word is below 0x800000, otherwise 4. The bus
      frequency each value selects is not established.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    i2c@e0500000 {
        compatible = "sony,vita-i2c";
        reg = <0xe0500000 0x1000>;
        interrupts = <GIC_SPI 110 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&reset 68>;
        sony,speed-mode = <5>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
